name: Deploy Cloudflare Pages

# Deploys only a SHA the CI workflow has fully verified (check:types, build
# checks, the full parallel test suite, packaging matrix). The suite is not
# re-run here; CI's success for the exact head SHA is the gate.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  # Lets the manual-dispatch path query CI run conclusions for the SHA.
  actions: read

jobs:
  deploy:
    name: Deploy verified production build
    # Only a green CI run for a push to main qualifies; the event guard keeps
    # pull_request CI runs (e.g. a fork branch named main) from deploying.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://rabbithole.ing/
    env:
      # workflow_run executes in default-branch context; pin every step to the
      # SHA CI actually verified, never the branch tip at trigger time.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # workflow_run arrives with CI's verdict; a manual dispatch does not, so
      # it must prove a completed green CI run exists for this exact SHA.
      - name: Require a green CI verdict for this commit (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&status=success" \
            --jq '.workflow_runs | length')
          if [ "$green" -eq 0 ]; then
            echo "::error::No successful CI run found for $DEPLOY_SHA; refusing to deploy an unverified commit."
            exit 1
          fi

      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # CI runs can finish out of order; a stale SHA must never overwrite a
      # newer deploy. The superseding commit's own CI run deploys instead.
      - name: Confirm the commit is still the tip of main
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
            echo "::error::$DEPLOY_SHA is no longer the tip of main; skipping in favor of the newer commit's run."
            exit 1
          fi

      # CI already built publish/ from this exact SHA and uploaded it; deploy
      # the verified bytes instead of rebuilding them here.
      - name: Download the verified production build from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Manual dispatch has no CI artifact handle, so it rebuilds from the
      # verified SHA it checked out above.
      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Build the production site
        if: github.event_name == 'workflow_dispatch'
        run: npm run build:publish

      - name: Deploy the verified commit to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish --project-name=rabbithole --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: "4"
