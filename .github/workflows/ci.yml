name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes in-flight verification; the newer
# run's verdict is the one deploy-pages.yml consumes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node-only gates plus the production build artifact deploy-pages consumes.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # CI is the only net for check:types; local `npm test` does not run it.
      - run: npm run check:types
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:purity
      - run: npm run test:unit
      # Build the deployable site once here so deploy-pages.yml can download
      # the exact verified bytes instead of rebuilding them.
      - name: Build the production site for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:publish
      - name: Upload the production site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish
          retention-days: 3

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Chromium's OS libraries are preinstalled on the runner image, so no
      # install-deps here — only the browser binary on a cache miss.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run build
      # Contracts ride here, not in checks: compatibility-security launches
      # chromium, and this is the lightest job that already installs it.
      - run: npm run test:contracts
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    # Generous only for the rare run that must pull apt packages through a
    # sick mirror to repopulate the deb cache; steady state is ~3 minutes.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      # Only firefox/webkit need apt OS libraries (chromium's are preinstalled),
      # and each shard installs only the browsers its bin actually launches.
      # The shard script owns the bin assignment, so ask it.
      - name: Determine which browser OS dependencies this shard needs
        id: needs-deps
        run: echo "browsers=$(node test/support/e2e-shard.mjs --needs-deps ${{ matrix.shard }} 3)" >> "$GITHUB_OUTPUT"
      # The Ubuntu mirrors have been observed both stalling outright and
      # crawling at ~100KB/s, so the network is not something this job may
      # depend on: the downloaded .debs are cached, apt is told to keep and
      # read them from a runner-owned directory, and after one populating run
      # every install is served from disk. Acquire timeouts plus a retry
      # handle the update phase; the step cap only bounds a populate through
      # a sick mirror.
      - name: Cache apt browser packages
        if: steps.needs-deps.outputs.browsers != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-debs-${{ runner.os }}-${{ steps.needs-deps.outputs.browsers }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            apt-debs-${{ runner.os }}-${{ steps.needs-deps.outputs.browsers }}-
      - name: Install browser OS dependencies
        if: steps.needs-deps.outputs.browsers != ''
        timeout-minutes: 15
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<EOF
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT::Keep-Downloaded-Packages "true";
          Dir::Cache::archives "$HOME/.cache/apt-archives/";
          EOF
          for i in 1 2; do
            if npx playwright install-deps ${{ steps.needs-deps.outputs.browsers }}; then
              break
            fi
            if [ "$i" = 2 ]; then
              exit 1
            fi
            sleep 5
          done
      - run: npm run build
      - run: node test/support/e2e-shard.mjs ${{ matrix.shard }} 3

  # Isolated so the budget gauges never share a runner with other browser jobs.
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:performance

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:packaging
